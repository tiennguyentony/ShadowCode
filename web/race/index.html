<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilemark race</title>
    <style>
      body { font: 16px/1.35 system-ui, sans-serif; margin: 0; padding: 8px; max-width: 720px; margin-inline: auto; }
      video { display: block; width: 100%; height: 42vh; object-fit: contain; background: #000; }
      .timers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
      .timer { border: 2px solid #ccc; border-radius: 8px; padding: 6px 8px; text-align: center; }
      .timer.running { border-color: #0a7; background: #effaf5; }
      .timer.done { border-color: #333; }
      .timer h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .timer output { display: block; font: 600 30px/1.2 ui-monospace, Consolas, monospace; }
      .buttons { display: grid; grid-template-columns: 1fr 1fr 0.7fr; gap: 8px; }
      button { font: inherit; font-weight: 600; padding: 12px 6px; border-radius: 8px; border: 1px solid #888; background: #f4f4f4; }
      button:disabled { opacity: 0.45; }
      #hint { min-height: 1.4em; margin: 6px 0; font-weight: 600; color: #b35a00; text-align: center; }
      #note { color: #555; font-size: 14px; margin: 4px 0; }
      #error { color: #c00; font-size: 14px; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; }
      th, td { padding: 4px 6px; border-bottom: 1px solid #ddd; text-align: right; font-variant-numeric: tabular-nums; }
      th:first-child, td:first-child { text-align: left; }
      td.found { background: #effaf5; font-weight: 600; }
      tfoot td { font-weight: 700; border-bottom: none; }
      #difference { margin: 8px 0; font-size: 18px; font-weight: 700; text-align: center; min-height: 1.4em; }
      #debug { color: #888; font: 12px/1.3 ui-monospace, Consolas, monospace; margin-top: 8px; word-break: break-word; }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div class="timers">
      <div class="timer" id="timer-qr"><h2>QR code</h2><output id="time-qr">–</output></div>
      <div class="timer" id="timer-tilemark"><h2>Tilemark</h2><output id="time-tilemark">–</output></div>
    </div>
    <div id="hint"></div>
    <div class="buttons">
      <button id="start-qr" type="button" disabled>Start QR</button>
      <button id="start-tilemark" type="button" disabled>Start Tilemark</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <div id="note"></div>
    <div id="error"></div>
    <table>
      <thead><tr><th>Product</th><th>QR</th><th>Tilemark</th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><td>Total</td><td id="total-qr">–</td><td id="total-tilemark">–</td></tr></tfoot>
    </table>
    <div id="difference"></div>
    <div id="debug"></div>
    <script type="module" src="../src/ui/race.ts"></script>
  </body>
</html>
