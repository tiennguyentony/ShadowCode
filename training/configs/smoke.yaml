# Smoke test: 300 steps, tiny generated dataset, simulation off.
# Same models and training step as the full run.
base: default.yaml

data:
  num_workers: 0

model:
  embedder:
    base_channels: 16          # half width, to keep CPU time reasonable

train:
  batch_size: 4
  total_steps: 300
  lr: 1.0e-3

loss:
  lpips_weight: 0.0            # keeps the smoke test offline: LPIPS needs pretrained weights

schedule:
  image_loss:
    acc_ema: 0.9

simulation:
  enabled: false

log:
  print_every: 25
